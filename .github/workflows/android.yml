name: Android JNI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-jni-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build libffmpeg_jni.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
            # NDK clang target triple stem used for the API-level-specific driver
            clang_triple: aarch64-linux-android
          - abi: armeabi-v7a
            arch: arm
            clang_triple: armv7a-linux-androideabi

    env:
      ANDROID_API: 24
      BUILD_DIR: build-android
      INSTALL_DIR: install
      OUT_DIR: android-jni

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (for javac -h)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android NDK
        id: ndk
        run: |
          # ubuntu-latest ships the NDK under $ANDROID_HOME/ndk/<version>
          NDK_ROOT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk"/* 2>/dev/null | tail -1)"
          if [ -z "$NDK_ROOT" ]; then
            echo "::error::No Android NDK found on runner"
            exit 1
          fi
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ndk_root=$NDK_ROOT"    >> "$GITHUB_OUTPUT"
          echo "ndk_bin=$NDK_BIN"      >> "$GITHUB_OUTPUT"
          echo "Found NDK at $NDK_ROOT"
          "$NDK_BIN/clang" --version

      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache pkg-config meson ninja-build
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # hashFiles globs must be explicit file patterns; bare 'lib*' matches
          # top-level dirs (libavcodec/, libavutil/, ...) and produces a hash
          # independent of their contents, so the key never changed with source.
          # Use recursive '**' patterns so the key actually tracks source edits.
          key: ccache-android-${{ matrix.abi }}-${{ hashFiles('configure', 'Makefile', 'lib*/**', 'ffbuild/**', 'compat/**') }}
          restore-keys: |
            ccache-android-${{ matrix.abi }}-

      - name: Configure NDK toolchain
        id: toolchain
        env:
          NDK_BIN: ${{ steps.ndk.outputs.ndk_bin }}
        run: |
          API="${ANDROID_API}"
          TRIPLE="${{ matrix.clang_triple }}"
          # API-level-specific clang driver: <triple><api>-clang
          CC="$NDK_BIN/${TRIPLE}${API}-clang"
          CXX="$NDK_BIN/${TRIPLE}${API}-clang++"
          AR="$NDK_BIN/llvm-ar"
          RANLIB="$NDK_BIN/llvm-ranlib"
          NM="$NDK_BIN/llvm-nm"
          STRIP="$NDK_BIN/llvm-strip"
          for tool in "$CC" "$AR" "$RANLIB" "$NM"; do
            [ -x "$tool" ] || { echo "::error::Missing tool: $tool"; exit 1; }
          done
          echo "cc=$CC"       >> "$GITHUB_OUTPUT"
          echo "cxx=$CXX"     >> "$GITHUB_OUTPUT"
          echo "ar=$AR"       >> "$GITHUB_OUTPUT"
          echo "ranlib=$RANLIB" >> "$GITHUB_OUTPUT"
          echo "nm=$NM"       >> "$GITHUB_OUTPUT"
          echo "strip=$STRIP" >> "$GITHUB_OUTPUT"

      - name: Cache mbedTLS install
        id: mbedtls-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/mbedtls-install
          key: mbedtls-${{ matrix.abi }}-v3.6.7-pic
          restore-keys: |
            mbedtls-${{ matrix.abi }}-

      - name: Build & install mbedTLS
        if: steps.mbedtls-cache.outputs.cache-hit != 'true'
        env:
          CC: ${{ steps.toolchain.outputs.cc }}
          AR: ${{ steps.toolchain.outputs.ar }}
          RANLIB: ${{ steps.toolchain.outputs.ranlib }}
        run: |
          set -euo pipefail
          MBED_VER="3.6.7"
          MBED_SRC="mbedtls-${MBED_VER}"
          MBED_PREFIX="$PWD/$BUILD_DIR/mbedtls-install"
          mkdir -p "$MBED_PREFIX"

          # Official release tarball already includes submodules + generated
          # files, so no Python/Perl tooling is required to build from source.
          # 3.6.x LTS is required: FFmpeg's tls_mbedtls.c and rtmpdh.* target the
          # 3.x API (mbedtls/bignum.h etc.); 4.x reorganised headers/libraries and
          # breaks rtmpdh.c compilation.
          curl -fsSL \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBED_VER}/${MBED_SRC}.tar.bz2" \
            -o "${MBED_SRC}.tar.bz2"
          echo "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6  ${MBED_SRC}.tar.bz2" | sha256sum -c -
          tar xjf "${MBED_SRC}.tar.bz2"

          # CMake build: ENABLE_TESTING=Off + ENABLE_PROGRAMS=Off prevents the
          # tests/ and programs/ subdirectories from being entered, which in turn
          # avoids the host-incompatible test-data generators (generate_psa_tests.py
          # via c_build_helper) that fail with "Exec format error" under a cross
          # Android CC. Static libraries only; USE_SHARED_MBEDTLS_LIBRARY=Off.
          # Default mbedtls_config.h keeps PSA on (psa_crypto_init, x509write_crt_*).
          #
          # -DCMAKE_C_FLAGS="-fPIC": mbedTLS/everest/p256m static targets are non-PIC
          # by default (only the SHARED target adds -fPIC). Non-PIC objects emit
          # relocations (R_ARM_REL32 on armeabi-v7a; R_AARCH64_ADR_PREL_PG_HI21 /
          # R_AARCH64_ADD_ABS_LO12_NC / R_AARCH64_LDST64_ABS_LO12_NC on arm64-v8a)
          # that ld.lld rejects when linked into the shared libffmpeg_jni.so
          # ("recompile with -fPIC"); Android API>=23 also forbids text relocations.
          # CMake treats CMAKE_C_FLAGS as the cached initial value; mbedTLS appends
          # its warning flags via set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -Wall ..."),
          # so -fPIC is preserved (-fPIC -Wall -Wextra ...), not clobbered. everest
          # and p256m share this project-level cache var and thus also get PIC.
          # Both ABIs now require -fPIC uniformly.
          cmake -S "${MBED_SRC}" -B build \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_INSTALL_PREFIX="$MBED_PREFIX" \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DUSE_SHARED_MBEDTLS_LIBRARY=Off \
            -DENABLE_TESTING=Off \
            -DENABLE_PROGRAMS=Off
          cmake --build build --parallel "$(nproc)"
          cmake --install build

          # 3.6.x layout: libs under <prefix>/lib, headers under <prefix>/include,
          # pkg-config under <prefix>/lib/pkgconfig. No tf-psa-crypto split.
          test -f "$MBED_PREFIX/lib/libmbedtls.a"
          test -f "$MBED_PREFIX/lib/libmbedcrypto.a"
          test -f "$MBED_PREFIX/lib/pkgconfig/mbedtls.pc"
          ls -l "$MBED_PREFIX/lib" "$MBED_PREFIX/lib/pkgconfig"

      - name: Cache cross deps (libass stack)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/deps-install
          key: deps-${{ matrix.abi }}-fribidi1.0.16-ft2.13.3-hb9.0.0-ass0.17.3-pic-v2
          restore-keys: |
            deps-${{ matrix.abi }}-

      - name: Build libass dependency stack
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_BIN="${{ steps.ndk.outputs.ndk_bin }}"
          SYSROOT="$(cd "$NDK_BIN/.." && pwd)/sysroot"
          # Plain toolchain clang (not the API wrappers): the target triple,
          # API level and --sysroot go into the meson cross file explicitly,
          # mirroring the layout libass's own Android CI uses.
          CC="$NDK_BIN/clang"
          CXX="$NDK_BIN/clang++"
          AR="$NDK_BIN/llvm-ar"
          STRIP="$NDK_BIN/llvm-strip"
          DEPS="$PWD/$BUILD_DIR/deps-install"
          mkdir -p "$DEPS"
          TARGET="${{ matrix.clang_triple }}${ANDROID_API}"
          case "${{ matrix.abi }}" in
            arm64-v8a)
              MESON_CPU_FAMILY=aarch64; MESON_CPU=aarch64; ARCH_ARGS="" ;;
            armeabi-v7a)
              MESON_CPU_FAMILY=arm; MESON_CPU=armv7
              ARCH_ARGS=", '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp', '-march=armv7-a'" ;;
            *) echo "::error::No meson cpu map for ${{ matrix.abi }}"; exit 1 ;;
          esac
          # Restrict pkg-config to our own prefix so host (x86_64) *.pc files
          # can never satisfy a cross dependency; features that are not found
          # (brotli, zstd, cairo via pkg-config, ...) auto-disable.
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          cat > "$BUILD_DIR/meson-cross.txt" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = '$MESON_CPU_FAMILY'
          cpu = '$MESON_CPU'
          endian = 'little'

          [built-in options]
          c_args = ['--target=$TARGET', '--sysroot=$SYSROOT'$ARCH_ARGS]
          cpp_args = ['--target=$TARGET', '--sysroot=$SYSROOT'$ARCH_ARGS]
          c_link_args = ['--target=$TARGET', '--sysroot=$SYSROOT'$ARCH_ARGS]
          cpp_link_args = ['--target=$TARGET', '--sysroot=$SYSROOT'$ARCH_ARGS]
          # These archives are linked into the shared libffmpeg_jni.so, so
          # every static object must be PIC (API>=23 also forbids text
          # relocations).
          b_staticpic = true
          EOF

          build_one() {
            # <name> <url> [extra meson options]
            local name="$1" url="$2"; shift 2
            echo "::group::$name"
            mkdir -p "$BUILD_DIR/$name-src"
            curl -fsSL "$url" | tar xz -C "$BUILD_DIR/$name-src" --strip-components=1
            meson setup "$BUILD_DIR/$name-src" "$BUILD_DIR/$name-build" \
              --cross-file "$BUILD_DIR/meson-cross.txt" \
              --prefix "$DEPS" --libdir lib --bindir bin \
              --buildtype=release --default-library=static \
              --wrap-mode=nodownload "$@"
            meson compile -C "$BUILD_DIR/$name-build" -j"$(nproc)"
            meson install -C "$BUILD_DIR/$name-build"
            echo "::endgroup::"
          }

          # Order matters: later packages find the earlier ones' .pc files
          # through PKG_CONFIG_LIBDIR.  Versions here also appear in the cache key.
          build_one fribidi \
            https://github.com/fribidi/fribidi/archive/refs/tags/v1.0.16.tar.gz \
            -Dtests=false -Ddocs=false
          # freetype: keep all compression extras at their auto-detected
          # defaults (zlib is provided by the NDK sysroot; bzip2/png/brotli
          # are absent there and drop out).
          build_one freetype \
            https://github.com/freetype/freetype/archive/refs/tags/VER-2-13-3.tar.gz \
            -Dtests=disabled
          # icu/glib/cairo/gobject/freetype/introspection/chafa: turn every
          # optional integration off explicitly (libass needs plain shaping;
          # hb's own freetype glue is not used). Harfbuzz tests defaults to
          # ENABLED, so -Dtests=disabled is mandatory.
          build_one harfbuzz \
            https://github.com/harfbuzz/harfbuzz/archive/refs/tags/9.0.0.tar.gz \
            -Dtests=disabled -Dicu=disabled -Dglib=disabled -Dgobject=disabled \
            -Dcairo=disabled -Dfreetype=disabled -Dintrospection=disabled -Dchafa=disabled
          # libass without a font provider on Android: MKV embedded fonts go
          # through ass_add_font() (registered by the JNI ass* entry points)
          # and fontsdir/fallback cover the rest.  require-system-font-provider
          # defaults TRUE and aborts 0.17.3 without an explicit false.
          # libunibreak stays auto-off (nodownload keeps its wrap out of reach;
          # libass falls back to built-in line-break tables).
          build_one libass \
            https://github.com/libass/libass/archive/refs/tags/0.17.3.tar.gz \
            -Dfontconfig=disabled -Drequire-system-font-provider=false

          # libass is C++ but meson's pkgconfig generator does not always add
          # the C++ runtime to Libs.private; FFmpeg's configure link test uses
          # the plain C driver, so guarantee the flag is present.
          grep -q '^Libs\.private=' "$DEPS/lib/pkgconfig/libass.pc" || \
            echo 'Libs.private=' >> "$DEPS/lib/pkgconfig/libass.pc"
          grep -Eq 'stdc\+\+|-lc\+\+' "$DEPS/lib/pkgconfig/libass.pc" || \
            sed -i 's/^Libs\.private=.*/& -lstdc++/' "$DEPS/lib/pkgconfig/libass.pc"
          ls -l "$DEPS/lib" "$DEPS/lib/pkgconfig"
          test -f "$DEPS/lib/libass.a"
          test -f "$DEPS/lib/pkgconfig/libass.pc"
          test -f "$DEPS/include/ass/ass.h"

      - name: Configure FFmpeg
        env:
          CC: ${{ steps.toolchain.outputs.cc }}
          AR: ${{ steps.toolchain.outputs.ar }}
          RANLIB: ${{ steps.toolchain.outputs.ranlib }}
          NM: ${{ steps.toolchain.outputs.nm }}
        run: |
          ccache -M 5G
          # ccache's compiler-check defaults to mtime, which changes between
          # runner instances (fresh NDK extraction) and forces a full miss on
          # every run even when ~/.ccache is restored.  Use content hashing so
          # a restored cache is actually reused across runs/runners.
          export CCACHE_COMPILERCHECK=content
          # Keep the cached compiler (-fPIC) flags stable; ccache only skips
          # preprocessing-dependent hashes when the input is identical.
          export CCACHE_BASEDIR="$PWD"
          ccache -z
          PREFIX="$PWD/$BUILD_DIR/$INSTALL_DIR"
          MBEDTLS_PREFIX="$PWD/$BUILD_DIR/mbedtls-install"
          DEPS_PREFIX="$PWD/$BUILD_DIR/deps-install"
          mkdir -p "$PREFIX"
          # Expose the just-built mbedTLS and the libass dependency stack via
          # pkg-config so configure's check_pkg_config() paths pick up the TLS
          # backend (pulls in ff_tls_protocol -> ff_https_protocol) and
          # libass/freetype for the subtitles filter.
          export PKG_CONFIG_PATH="$MBEDTLS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export PKG_CONFIG_LIBDIR="$MBEDTLS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib/pkgconfig"
          # --enable-jni + --enable-mediacodec enables the Android MediaCodec
          # hardware decoders (h264_mediacodec, hevc_mediacodec, av1_mediacodec,
          # mpeg4_mediacodec, vp8/9_mediacodec, mp3_mediacodec, ...). The
          # decoders run in the MediaCodec framework via the NDK mediandk +
          # native binder API; configure pulls in compat/android/binder.o and
          # needs jni.h + media/NdkMediaFormat.h, both present in the NDK
          # unified sysroot of the API-level-specific clang driver.
          # --enable-hwaccel* flags are no longer separate configure options:
          # the mediacodec hwaccel is auto-selected by the decoders above.
          # --enable-libass pulls in the "subtitles"/"ass" filters (see the
          # libass dependency stack step).  fontconfig is deliberately NOT
          # enabled: it is only a drawtext/showcqt extra (subtitles_filter_deps
          # is "avformat avcodec libass"), and there is no usable
          # system fonts.conf on Android — embedded MKV fonts go through
          # ass_add_font()/fontsdir instead.  fribidi+harfbuzz are built, so
          # also enable them for the drawtext font path.
          ./configure \
            --target-os=android --enable-cross-compile \
            --arch=${{ matrix.arch }} \
            --cc="ccache $CC" --ar="$AR" --ranlib="$RANLIB" --nm="$NM" \
            --enable-gpl --enable-nonfree \
            --enable-static --disable-shared \
            --disable-doc --disable-avdevice --disable-programs \
            --enable-pic \
            --enable-version3 \
            --enable-mbedtls --pkg-config-flags="--static" \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libharfbuzz \
            --enable-jni --enable-mediacodec \
            --extra-cflags="-fPIC -O2" \
            --extra-ldflags="-lm -lz" \
            --extra-libs="-lstdc++" \
            --prefix="$PREFIX" \
            || CFGRES=$?
          cat ffbuild/config.log || true
          # Surface the resolved feature flags so a missed mediacodec enablement
          # is obvious in the log rather than buried in configure's full trace.
          echo "::group::FFmpeg configure flags"
          grep -E '^(CONFIG_MEDIACODEC|CONFIG_JNI|CONFIG_(H264|HEVC|AV1|MPEG4|VP8|VP9|MP3)_MEDIACODEC)' \
            ffbuild/config.mak 2>/dev/null || true
          echo "::endgroup::"
          exit ${CFGRES:-0}

      - name: Build & install FFmpeg
        run: |
          make -j"$(nproc)"
          make install
          echo "::group::Installed static libraries"
          ls -l "$BUILD_DIR/$INSTALL_DIR/lib"
          echo "::endgroup::"
          echo "::group::ccache statistics"
          ccache -s
          echo "::endgroup::"

      - name: Generate JNI header (javac -h)
        run: |
          JNI_DIR=compat/android/jni
          mkdir -p "$JNI_DIR/generated"
          # FFMpegNative.java references android.view.Surface, so javac needs
          # android.jar on the classpath to resolve it.
          ANDROID_JAR="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)"
          javac -classpath "$ANDROID_JAR" -h "$JNI_DIR/generated" -d "$JNI_DIR/generated" "$JNI_DIR/java/org/ffmpeg/FFMpegNative.java"
          # The header is named after the class: org_ffmpeg_FFMpegNative.h
          ls -l "$JNI_DIR/generated/"

      - name: Compile libffmpeg_jni.so
        env:
          NDK_BIN: ${{ steps.ndk.outputs.ndk_bin }}
          CC: ${{ steps.toolchain.outputs.cc }}
          CXX: ${{ steps.toolchain.outputs.cxx }}
          STRIP: ${{ steps.toolchain.outputs.strip }}
        run: |
          ABI="${{ matrix.abi }}"
          PREFIX="$PWD/$BUILD_DIR/$INSTALL_DIR"
          MBEDTLS_PREFIX="$PWD/$BUILD_DIR/mbedtls-install"
          DEPS_PREFIX="$PWD/$BUILD_DIR/deps-install"
          OUT="$PWD/$OUT_DIR/$ABI/lib"
          CLS="$PWD/$OUT_DIR/$ABI/classes"
          JNI_OBJ="$PWD/$BUILD_DIR/ffmpeg_jni-$ABI.o"
          mkdir -p "$OUT" "$CLS"

          # Compile the JNI translation unit as C. Passing a .c file to clang++
          # makes NDK 29 treat FFmpeg's C headers and JNIEnv ABI as C++17.
          "$CC" -c -fPIC -O2 \
            -I"$PWD" -I"$PWD/compat/android/jni" -I"$PWD/compat/android/jni/generated" \
            -I"$PREFIX/include" -I"$DEPS_PREFIX/include" \
            "$PWD/compat/android/jni/ffmpeg_jni.c" \
            -o "$JNI_OBJ"

          # Link with the API-level-specific clang++ driver because libass is
          # C++; -static-libstdc++ avoids a libc++_shared.so DT_NEEDED entry.
          # The FFmpeg static libs now reference MediaCodec decoder objects
          # (h264_mediacodec, hevc_mediacodec, ...) which call the NDK mediandk
          # + native_window + binder APIs. Those live in the Android platform
          # shared libraries shipped in the NDK unified sysroot:
          #   -lmediandk    : AMediaCodec/AMediaFormat (MediaCodec bridge)
          #   -landroid     : ANativeWindow (hwframes mediacodec surfaces)
          #   -ljnigraphics : AImage / bitmap helpers used by some mediacodec
          #                   paths; harmless if unreferenced (the linker drops it)
          # All three are available from API 21+ at the chosen API 24 driver.
          "$CXX" -shared -fPIC \
            "$JNI_OBJ" \
            -L"$PREFIX/lib" -L"$MBEDTLS_PREFIX/lib" -L"$DEPS_PREFIX/lib" \
            -Wl,--start-group \
            -lavformat -lavcodec -lavfilter -lswscale -lswresample -lavutil \
            -lmbedtls -lmbedx509 -lmbedcrypto \
            -Wl,--end-group \
            -Wl,--start-group \
            -lass -lharfbuzz -lfreetype -lfribidi \
            -Wl,--end-group \
            -static-libstdc++ \
            -lmediandk -landroid -ljnigraphics \
            -llog -lm -lz \
            -Wl,-soname,libffmpeg_jni.so \
            -o "$OUT/libffmpeg_jni.so"

          echo "::group::libffmpeg_jni.so details"
          file "$OUT/libffmpeg_jni.so"
          DYNAMIC_SECTION=$("$NDK_BIN/llvm-readelf" -d "$OUT/libffmpeg_jni.so")
          printf '%s\n' "$DYNAMIC_SECTION"
          if ! printf '%s\n' "$DYNAMIC_SECTION" | grep -Fq 'Shared library: [liblog.so]'; then
            echo "::error::libffmpeg_jni.so does not declare liblog.so in DT_NEEDED"
            exit 1
          fi
          # mediacodec hardware decoders require the NDK platform libs to be
          # recorded as DT_NEEDED so they resolve at runtime on the device.
          for needlib in libmediandk.so libandroid.so; do
            if ! printf '%s\n' "$DYNAMIC_SECTION" | grep -Fq "Shared library: [${needlib}]"; then
              echo "::error::libffmpeg_jni.so does not declare ${needlib} in DT_NEEDED (mediacodec HW decode won't load)"
              exit 1
            fi
          done
          echo "MediaCodec platform libs (libmediandk.so, libandroid.so) in DT_NEEDED"
          # libffmpeg_jni.so embeds C++ libass code; the static libc++ link
          # must have prevented a libc++_shared.so runtime dependency, which
          # an APK that does not also ship that library could not satisfy.
          if printf '%s\n' "$DYNAMIC_SECTION" | grep -Fq 'Shared library: [libc++_shared.so]'; then
            echo "::error::libffmpeg_jni.so depends on libc++_shared.so (C++ runtime must be linked statically)"
            exit 1
          fi
          echo "C++ runtime linked statically (no libc++_shared.so in DT_NEEDED)"
          export_syms=$("$NDK_BIN/llvm-nm" -D "$OUT/libffmpeg_jni.so" 2>/dev/null)
          # Best-effort listing of all exported JNI symbols (informational).
          printf '%s\n' "$export_syms" | grep -E 'Java_org_ffmpeg' || true
          # Hard-assert the new Surface zero-copy JNI entry points are actually
          # exported: a missing dynamic export means javac -h and the C side
          # diverged on a signature, or the function was compiled out.
          for sym in Java_org_ffmpeg_FFMpegNative_packetClone \
                     Java_org_ffmpeg_FFMpegNative_mediasurfaceHwdeviceCreate \
                     Java_org_ffmpeg_FFMpegNative_setContextHwDeviceCtx \
                     Java_org_ffmpeg_FFMpegNative_setContextPktTimebase \
                     Java_org_ffmpeg_FFMpegNative_streamGetParProfile \
                     Java_org_ffmpeg_FFMpegNative_streamGetParChannelLayout \
                     Java_org_ffmpeg_FFMpegNative_windowRendererCreate \
                     Java_org_ffmpeg_FFMpegNative_windowRendererSetSize \
                     Java_org_ffmpeg_FFMpegNative_windowRendererRender \
                     Java_org_ffmpeg_FFMpegNative_windowRendererFree \
                     Java_org_ffmpeg_FFMpegNative_aacAdtsPackerCreate \
                     Java_org_ffmpeg_FFMpegNative_aacAdtsPackerWrap \
                     Java_org_ffmpeg_FFMpegNative_aacAdtsPackerFree \
                      Java_org_ffmpeg_FFMpegNative_interruptFlagCreate \
                      Java_org_ffmpeg_FFMpegNative_formatSetInterruptFlag \
                      Java_org_ffmpeg_FFMpegNative_interruptFlagAbort \
                      Java_org_ffmpeg_FFMpegNative_interruptFlagFree \
                      Java_org_ffmpeg_FFMpegNative_streamGetParExtradataSize \
                      Java_org_ffmpeg_FFMpegNative_codecGetSubtitleHeaderSize \
                      Java_org_ffmpeg_FFMpegNative_codecGetSubtitleHeader \
                      Java_org_ffmpeg_FFMpegNative_assLibCreate \
                      Java_org_ffmpeg_FFMpegNative_assLibFree \
                      Java_org_ffmpeg_FFMpegNative_assRendererCreate \
                      Java_org_ffmpeg_FFMpegNative_assRendererFree \
                      Java_org_ffmpeg_FFMpegNative_assTrackCreate \
                      Java_org_ffmpeg_FFMpegNative_assTrackFree \
                      Java_org_ffmpeg_FFMpegNative_assTrackFlushEvents \
                      Java_org_ffmpeg_FFMpegNative_assTrackGetPlayResX \
                      Java_org_ffmpeg_FFMpegNative_assTrackGetPlayResY \
                      Java_org_ffmpeg_FFMpegNative_assAddFont \
                      Java_org_ffmpeg_FFMpegNative_assClearFonts \
                      Java_org_ffmpeg_FFMpegNative_assSetFontsDir \
                      Java_org_ffmpeg_FFMpegNative_assSetFonts \
                      Java_org_ffmpeg_FFMpegNative_assSetFrameSize \
                      Java_org_ffmpeg_FFMpegNative_assSetStorageSize \
                      Java_org_ffmpeg_FFMpegNative_assSetMargins \
                      Java_org_ffmpeg_FFMpegNative_assSetUseMargins \
                      Java_org_ffmpeg_FFMpegNative_assSetFontScale \
                      Java_org_ffmpeg_FFMpegNative_assProcessCodecPrivate \
                      Java_org_ffmpeg_FFMpegNative_assProcessData \
                      Java_org_ffmpeg_FFMpegNative_assProcessChunk \
                      Java_org_ffmpeg_FFMpegNative_assRenderFrame \
                      Java_org_ffmpeg_FFMpegNative_assImageGetNext \
                      Java_org_ffmpeg_FFMpegNative_assImageGetWidth \
                      Java_org_ffmpeg_FFMpegNative_assImageGetHeight \
                      Java_org_ffmpeg_FFMpegNative_assImageGetStride \
                      Java_org_ffmpeg_FFMpegNative_assImageGetColor \
                      Java_org_ffmpeg_FFMpegNative_assImageGetDst \
                      Java_org_ffmpeg_FFMpegNative_assImageGetTop \
                      Java_org_ffmpeg_FFMpegNative_assImageGetLeft \
                      Java_org_ffmpeg_FFMpegNative_assImageGetBitmap; do
            if ! printf '%s\n' "$export_syms" | grep -q " ${sym}$"; then
              echo "::error::libffmpeg_jni.so does not export ${sym} (JNI signature mismatch or compiled out)"
              exit 1
            fi
            echo "Exported JNI symbol present: ${sym}"
          done
          # Verify HTTP/HTTPS protocol symbols and the mbedTLS TLS backend are
          # linked in. These are internal global URLProtocol symbols, NOT in the
          # dynamic export table (.dynsym), so we must read the full static symbol
          # table (.symtab) via llvm-nm WITHOUT -D.  This MUST run BEFORE strip:
          # `--strip-unneeded` removes .symtab (keeping only .dynsym), after which
          # llvm-nm reports "no symbols" and the check would false-negative.
          "$NDK_BIN/llvm-nm" --defined-only "$OUT/libffmpeg_jni.so" > /tmp/jni_syms.txt
          # The new Surface zero-copy path depends on the mediacodec hwcontext
          # backend being linked (av_hwdevice_ctx_alloc dispatches to its
          # AVHWDeviceType::device_create via ff_hwcontext_type_mediacodec).
          # Both are libavutil internal symbols (.symtab, not .dynsym); their
          # absence would make mediasurfaceHwdeviceCreate silently fall back /
          # fail at runtime even though the JNI export checks above pass.
          for sym in av_hwdevice_ctx_alloc ff_hwcontext_type_mediacodec; do
            if ! grep -q " ${sym}$" /tmp/jni_syms.txt; then
              echo "::error::libffmpeg_jni.so missing ${sym} (mediacodec hwcontext backend not linked)"
              exit 1
            fi
            echo "MediaCodec hwcontext backend symbol present: ${sym}"
          done
          for sym in ff_http_protocol ff_https_protocol ff_tls_protocol ff_tcp_protocol; do
            if ! grep -q " ${sym}$" /tmp/jni_syms.txt; then
              echo "::error::libffmpeg_jni.so missing ${sym} (network/protocol not linked)"
              exit 1
            fi
          done
          if ! grep -q ' mbedtls_ssl_init$' /tmp/jni_syms.txt; then
            echo "::warning::mbedtls_ssl_init not found in defined symbols; check tls backend linkage"
          fi
          echo "HTTP/HTTPS protocol symbols present"
          # libass subtitle rendering (--enable-libass): the ass/subtitles
          # filter objects and the libass core must end up linked. The ass_*
          # entries are referenced by ffmpeg_jni.c's libass wrappers, so their
          # absence means the .so was rebuilt without the libass deps it needs.
          for sym in ff_ass_filter ff_subtitles_filter ass_library_init ass_add_font ass_render_frame; do
            if ! grep -q " ${sym}$" /tmp/jni_syms.txt; then
              echo "::error::libffmpeg_jni.so missing ${sym} (libass subtitle rendering not linked)"
              exit 1
            fi
          done
          echo "libass subtitle rendering symbols present"
          # Verify at least one MediaCodec hardware decoder is actually linked
          # in. The ff_<name>_mediacodec_decoder FFCodec objects are static
          # globals (in .symtab, not .dynsym), so this must use the --start-group
          # link above to pull them in from libavcodec.a. Any one of the common
          # HW decoders satisfies this; absent all of them, the configure flags
          # did not enable mediacodec.
          mc_found=0
          for sym in ff_h264_mediacodec_decoder ff_hevc_mediacodec_decoder \
                      ff_av1_mediacodec_decoder ff_mpeg4_mediacodec_decoder \
                      ff_vp8_mediacodec_decoder ff_vp9_mediacodec_decoder \
                      ff_mp3_mediacodec_decoder; do
            if grep -q " ${sym}$" /tmp/jni_syms.txt; then
              mc_found=1
              echo "MediaCodec HW decoder present: ${sym}"
              break
            fi
          done
          if [ "$mc_found" -ne 1 ]; then
            echo "::error::No mediacodec decoder linked in (--enable-mediacodec build issue)"
            exit 1
          fi
          echo "::endgroup::"

          # Strip only AFTER the .symtab-based checks above succeed: it removes
          # .symtab/.strtab (keeping .dynsym) to shrink the shipped .so.  The
          # `|| true` keeps the build green if the tool is unavailable; the
          # functional checks already passed by this point.
          "$STRIP" --strip-unneeded "$OUT/libffmpeg_jni.so" || true

      - name: Compile Java sample class
        run: |
          ABI="${{ matrix.abi }}"
          CLS="$PWD/$OUT_DIR/$ABI/classes"
          mkdir -p "$CLS/org/ffmpeg"
          # FFMpegNative.java references android.view.Surface, so javac needs
          # android.jar on the classpath to resolve it.
          ANDROID_JAR="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)"
          javac -classpath "$ANDROID_JAR" -d "$CLS" compat/android/jni/java/org/ffmpeg/FFMpegNative.java
          find "$CLS" -name '*.class' -print

      - name: Stage artifact
        run: |
          tree "$OUT_DIR/${{ matrix.abi }}" 2>/dev/null || find "$OUT_DIR/${{ matrix.abi }}" -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-jni-${{ matrix.abi }}
          path: android-jni/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle all ABIs
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: ffmpeg-jni-all
          pattern: ffmpeg-jni-*
          merge-multiple: false

      - name: Reorganize layout
        run: |
          mkdir -p ffmpeg-jni-bundle/jniLibs ffmpeg-jni-bundle/classes
          for d in ffmpeg-jni-all/ffmpeg-jni-*; do
            abi=$(basename "$d" | sed 's/^ffmpeg-jni-//')
            mkdir -p "ffmpeg-jni-bundle/jniLibs/$abi"
            cp "$d/lib/libffmpeg_jni.so" "ffmpeg-jni-bundle/jniLibs/$abi/" 2>/dev/null || true
            cp -r "$d/classes/org" "ffmpeg-jni-bundle/classes/" 2>/dev/null || true
          done
          find ffmpeg-jni-bundle -type f | sort

      - name: Upload bundled artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-jni-all-abis
          path: ffmpeg-jni-bundle/
          retention-days: 30
